<div class="hero-clouds" aria-hidden="true">
  <span class="cloud-layer cloud-layer-far"></span>
  <span class="cloud-layer cloud-layer-near"></span>
</div>

{% comment %}
  The artwork is a wide panorama so the SVG always scales to the container's
  height and crops horizontally instead of chopping the tower tops. The Chicago
  landmarks sit in the middle, which is the region that stays visible at every
  viewport width.
{% endcomment %}

    <defs>
      <pattern id="skyline-windows" width="18" height="24" patternUnits="userSpaceOnUse">
        <rect x="5" y="7" width="8" height="9" fill="rgba(255, 255, 255, 0.07)"></rect>
